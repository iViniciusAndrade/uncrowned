name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Chave de assinatura
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "UC_KEYSTORE_PASSWORD=$KS_PW" >> "$GITHUB_ENV"
            echo "::notice::Assinando com a chave fixa dos segredos do repositório"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.jks" -storetype PKCS12 -alias uncrowned -keyalg RSA -keysize 2048 -validity 10000 -storepass temporaria -keypass temporaria -dname "CN=Uncrowned"
            echo "UC_KEYSTORE_PASSWORD=temporaria" >> "$GITHUB_ENV"
            echo "::warning::Sem o segredo ANDROID_KEYSTORE_B64: APK assinado com chave temporária. Configure os segredos para as atualizações instalarem por cima (ver README)."
          fi
          echo "UC_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Compilar APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Renomear
        run: cp app/build/outputs/apk/release/app-release.apk Uncrowned-build-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Uncrowned-build-${{ github.run_number }}
          path: Uncrowned-build-${{ github.run_number }}.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Uncrowned build ${{ github.run_number }}
          files: Uncrowned-build-${{ github.run_number }}.apk
