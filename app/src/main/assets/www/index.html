<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Uncrowned Train</title>
<link rel="stylesheet" href="lib/leaflet.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="brand"><button class="icon-btn back-btn" id="btn-back" type="button" aria-label="Voltar para a tela anterior" hidden><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button><img src="img/logo.png" alt="" width="24" height="28" style="object-fit:contain"><span>UNCROWNED TRAIN</span></div>
    <button class="icon-btn" id="btn-profile" type="button" aria-label="Perfil e ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav id="tabs" aria-label="Seções">
    <button type="button" data-tab="hoje"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span>Hoje</span></button>
    <button type="button" data-tab="treino"><svg viewBox="0 0 24 24"><path d="M3 10v4M6 7v10M18 7v10M21 10v4M6 12h12"/></svg><span>Treino</span></button>
    <button type="button" id="mic" aria-label="Falar com o Uncrowned"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button type="button" data-tab="comida"><svg viewBox="0 0 24 24"><path d="M5.5 3v5.5a3 3 0 0 0 6 0V3M8.5 3v5.5M8.5 11.5V21M18 21V3c-2.2 1.2-3.5 3.8-3.5 7v3h3.5"/></svg><span>Comida</span></button>
    <button type="button" data-tab="bike"><svg viewBox="0 0 24 24"><circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-7h5l3 7M10 9l2 7h-6M14 6h2"/></svg><span>Bike</span></button>
  </nav>
</div>

<div id="sheet" class="sheet" aria-hidden="true"><div class="sheet-backdrop" data-close></div><div class="sheet-body" role="dialog" aria-modal="true"><div class="sheet-grip"></div><div id="sheet-content"></div></div></div>
<div id="player" class="player" aria-hidden="true"></div>
<div id="voice" class="voice" aria-hidden="true"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="lib/three.min.js"></script>
<script src="lib/leaflet.js"></script>
<script src="data/foods.js"></script>
<script src="data/generic.js"></script>
<script src="js/bridge.js"></script>
<script src="js/store.js"></script>
<script src="js/food.js"></script>
<script src="js/label.js"></script>
<script src="js/exercises.js"></script>
<script src="js/mannequin.js"></script>
<script src="js/voice.js"></script>
<script src="js/energy.js"></script>
<script src="js/player.js"></script>
<script src="js/bike.js"></script>
<script src="js/app.js"></script>
</body>
</html>
